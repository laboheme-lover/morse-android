# v1.2.3 の形のタグを push すると、テストのあと署名した APK を作って Releases に載せる。
# 署名の鍵は Secrets(ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD)から取り出す。鍵の別名は秘密ではないのでここに書く
# (Secrets に入れるとログの中の同じ文字列がすべて伏せられる)
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Version from tag
        id: ver
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + ${patch:-0} ))" >> "$GITHUB_OUTPUT"
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MORSE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build and test
        env:
          MORSE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MORSE_KEY_ALIAS: morse
        run: >
          ./gradlew testDebugUnitTest assembleRelease
          -PversionName=${{ steps.ver.outputs.name }} -PversionCode=${{ steps.ver.outputs.code }}
      - name: Check signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$apk" | head -3
          cp "$apk" "morse-${GITHUB_REF_NAME}.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "morse-${GITHUB_REF_NAME}.apk" --title "モールス通信 $GITHUB_REF_NAME" --generate-notes
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
